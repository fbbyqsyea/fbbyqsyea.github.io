<style>
/* VS Code Dark High Contrast + Custom User Settings */

html, body {
    /* Default Font Size */
}

:root {
    --body-background: #000000;
    --body-font-color: #ffffff;
    --color-link: #75beff;
    --color-visited-link: #75beff;
    --color-accent: #6fc3df;
    --color-border: #6fc3df;
    --color-border-active: #ffffff;
    --menu-background: #000000;
    --menu-font-color: #ffffff;
    --menu-border-color: #6fc3df;
    --header-background: #000000;
    --header-font-color: #ffffff;
    --header-border-color: #6fc3df;
    --code-background: #000000;
    --code-border: #6fc3df;
}

body {
    background-color: var(--body-background) !important;
    color: var(--body-font-color) !important;
}

.book-menu, .book-menu * {
    /* Default Font */
}

.book-header, .book-header * {
    /* Default Font */
}

.book-toc, .book-toc * {
    /* Default Font */
}

.book-content, .markdown, .markdown * {
    /* Default Font */
}

.book-markdown pre, .book-markdown pre *, .book-markdown code, .markdown p code, .markdown li code, .markdown table code {
    /* Default Font */
}

/* 2. Chapter Numbering */
.book-menu nav ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
}

.book-menu nav ul ul {
    counter-reset: chapter-counter;
}

.book-menu nav ul ul li {
    counter-increment: chapter-counter;
}

.book-menu nav ul ul li > a::before {
    content: counter(chapter-counter) ". ";
    opacity: 0.6;
    margin-right: 6px;
    color: var(--menu-font-color);
    font-family: monospace;
}

/* 3. Collapsible Visuals */
.book-menu nav > ul > li > a {
    cursor: pointer;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.book-menu nav > ul > li > a::after {
    content: "▼";
    font-size: 0.7em;
    margin-left: 8px;
    opacity: 0.7;
    transition: transform 0.2s;
}

.book-menu nav > ul > li.collapsed > a::after {
    transform: rotate(-90deg);
}

.book-menu nav a.active {
    color: var(--color-accent) !important;
    font-weight: bold;
    background: rgba(111, 195, 223, 0.1);
    border-left: 3px solid var(--color-accent);
    padding-left: 10px;
    margin-left: -3px;
}

.book-header {
    background: var(--header-background) !important;
    border-bottom: 2px solid var(--header-border-color) !important;
    color: var(--header-font-color);
    gap: 0.5rem;
}

.book-brand img {
    filter: none !important;
}

.book-header input {
    background: #111;
    border: 1px solid #333;
    color: #fff;
}

.markdown h1, .markdown h2, .markdown h3, .markdown h4 {
    color: #ffffff;
    border-bottom-color: #333;
}

.markdown a {
    color: var(--color-link);
    border-bottom: 1px dotted var(--color-link);
}

.markdown a:hover {
    color: #ffffff;
    border-bottom-color: #ffffff;
}

.markdown table {
    border-color: #6fc3df;
}
.markdown table th, .markdown table td {
    border-color: #6fc3df;
}
.markdown table th {
    background-color: #111;
}

.book-markdown pre {
    background: var(--code-background) !important;
    border: 1px solid var(--code-border) !important;
    padding: 1rem;
}

.book-markdown code {
    background: #111111 !important;
    border: 1px solid #333;
    color: #d4d4d4;
}

.markdown p code, .markdown li code, .markdown table code {
    background: #111111 !important;
    border: 1px solid #444;
    color: #9cdcfe;
}

.chroma {
    background-color: #000000 !important;
    color: #ffffff;
    border: none;
}
.chroma .k, .chroma .kc, .chroma .kd, .chroma .kp, .chroma .kr, .chroma .kt {
    color: #569cd6 !important;
    font-weight: bold;
}
.chroma .s, .chroma .sa, .chroma .sb, .chroma .sc, .chroma .dl, .chroma .sd, .chroma .s2, .chroma .se, .chroma .sh, .chroma .si, .chroma .s1 {
    color: #ce9178 !important;
}
.chroma .c, .chroma .ch, .chroma .cm, .chroma .cp, .chroma .cpf, .chroma .c1, .chroma .cs {
    color: #6a9955 !important;
    font-style: italic;
}
.chroma .nf, .chroma .fm {
    color: #dcdcaa !important;
}
.chroma .m, .chroma .mb, .chroma .mf, .chroma .mh, .chroma .mi, .chroma .il, .chroma .mo {
    color: #b5cea8 !important;
}
.chroma .kt, .chroma .nc {
    color: #4ec9b0 !important;
}
.chroma .nv, .chroma .vc {
    color: #9cdcfe !important;
}
.chroma .p, .chroma .o {
    color: #ffffff !important;
}

::-webkit-scrollbar {
    width: 14px;
    height: 14px;
}
::-webkit-scrollbar-track {
    background: #000000;
    border-left: 1px solid #333;
}
::-webkit-scrollbar-thumb {
    background: #6fc3df;
    border: 2px solid #000000;
}
::-webkit-scrollbar-thumb:hover {
    background: #ffffff;
}

.book-toc nav a {
    color: #888;
}
.book-toc nav a:hover {
    color: #fff;
}
.book-toc nav a.active {
    color: #6fc3df;
    border-left: 2px solid #6fc3df;
}
</style>
